services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RETENTION_MINUTES: ${RETENTION_MINUTES:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-40}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      JOBS_DIR: /data/jobs
    tmpfs:
      - /data/jobs:mode=0700,uid=1000   # uploads live in RAM-backed temp storage; remove tmpfs for a persistent volume
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${SITE_URL:-http://localhost:8080}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
